<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up · Magni</title>
  <style>
    :root { --bg:#0f0f11; --card:#1a1a1e; --text:#e8e8ea; --dim:#9b9b9b; --accent:#f59e0b; --border:#2a2a30; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2.5rem; width:100%; max-width:400px; }
    .brand { font-size:1.5rem; font-weight:700; margin-bottom:0.25rem; }
    .brand span { color:var(--accent); }
    .sub { color:var(--dim); font-size:0.9rem; margin-bottom:1.75rem; }
    label { display:block; font-size:0.85rem; margin:1rem 0 0.35rem; color:var(--dim); }
    input { width:100%; padding:0.7rem 0.85rem; border-radius:9px; border:1px solid var(--border); background:#121216; color:var(--text); font-size:0.95rem; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:1.5rem; padding:0.8rem; border:none; border-radius:9px; background:var(--accent); color:#1a1a1e; font-weight:700; font-size:0.95rem; cursor:pointer; }
    button:hover { filter:brightness(1.05); }
    .err { background:#3a1a1a; border:1px solid #6b2b2b; color:#ffb4b4; padding:0.7rem 0.85rem; border-radius:9px; font-size:0.85rem; margin-bottom:1rem; }
    .alt { text-align:center; margin-top:1.25rem; font-size:0.85rem; color:var(--dim); }
    .alt a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Magni<span>.</span></div>
    <div class="sub">Create your account and get an AI support agent for your site.</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST" action="/signup">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="business_name">Business name</label>
      <input id="business_name" name="business_name" type="text" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <button type="submit">Create account</button>
    </form>
    <div class="alt">Already have an account? <a href="/client/login">Log in</a></div>
  </div>
</body>
</html>
